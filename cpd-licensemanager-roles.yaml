kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cpd-licensemanager-list
rules:
  - verbs:
      - list
    apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
      - deployments/status
  - verbs:
      - list
    apiGroups:
      - ''
    resources:
      - pods
